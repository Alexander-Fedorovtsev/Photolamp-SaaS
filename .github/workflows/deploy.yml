name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: photolamp-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.STAGING_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Verify exact revision passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          bash infra/scripts/verify-ci-run.sh \
            "$DEPLOY_SHA" "$REPOSITORY" "$RUNNER_TEMP/photolamp-ci-runs.json"
      - name: Configure verified SSH access
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          for name in STAGING_HOST STAGING_USER STAGING_SSH_PORT STAGING_SSH_KEY STAGING_KNOWN_HOSTS; do
            [[ -n "${!name}" ]] || { echo "Missing staging secret: $name" >&2; exit 1; }
          done
          [[ "$STAGING_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$STAGING_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$STAGING_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          (( 10#$STAGING_SSH_PORT > 0 && 10#$STAGING_SSH_PORT <= 65535 ))
          umask 077
          printf '%s\n' "$STAGING_SSH_KEY" > "$RUNNER_TEMP/photolamp-staging-key"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$RUNNER_TEMP/photolamp-known-hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/photolamp-staging-key" > /dev/null
          host_lookup="$STAGING_HOST"
          if [[ "$STAGING_SSH_PORT" != 22 ]]; then host_lookup="[$STAGING_HOST]:$STAGING_SSH_PORT"; fi
          ssh-keygen -F "$host_lookup" -f "$RUNNER_TEMP/photolamp-known-hosts" > /dev/null
      - name: Deploy CI-approved source over SSH
        run: |
          set -Eeuo pipefail
          ssh -i "$RUNNER_TEMP/photolamp-staging-key" -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=4 \
            -o UserKnownHostsFile="$RUNNER_TEMP/photolamp-known-hosts" \
            "$STAGING_USER@$STAGING_HOST" bash -s -- "$DEPLOY_SHA" \
            < infra/scripts/remote-deploy.sh
      - name: Remove SSH material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/photolamp-staging-key" "$RUNNER_TEMP/photolamp-known-hosts" "$RUNNER_TEMP/photolamp-ci-runs.json"
