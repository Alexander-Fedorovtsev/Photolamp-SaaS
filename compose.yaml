name: photolamp

x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:-development}
  ENABLE_DEMO_PREVIEWS: ${ENABLE_DEMO_PREVIEWS:-true}
  HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-600}
  CHECKOUT_SESSION_TTL_SECONDS: ${CHECKOUT_SESSION_TTL_SECONDS:-1800}
  CHECKOUT_RATE_LIMIT_WINDOW_SECONDS: ${CHECKOUT_RATE_LIMIT_WINDOW_SECONDS:-60}
  CHECKOUT_SESSION_RATE_LIMIT: ${CHECKOUT_SESSION_RATE_LIMIT:-10}
  CHECKOUT_MUTATION_RATE_LIMIT: ${CHECKOUT_MUTATION_RATE_LIMIT:-10}
  SMS_PROVIDER_MODE: ${SMS_PROVIDER_MODE:-memory}
  OTP_PEPPER: ${OTP_PEPPER:-local-synthetic-otp-pepper-change-me}
  CONTACT_ENCRYPTION_KEY: ${CONTACT_ENCRYPTION_KEY:-cGhvdG9sYW1wLWxvY2FsLXN5bnRoZXRpYy1rZXktdjE=}
  OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
  OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
  OTP_REQUEST_RATE_LIMIT: ${OTP_REQUEST_RATE_LIMIT:-3}
  OTP_VERIFY_RATE_LIMIT: ${OTP_VERIFY_RATE_LIMIT:-10}
  CUSTOMER_SESSION_TTL_SECONDS: ${CUSTOMER_SESSION_TTL_SECONDS:-86400}
  DATABASE_URL: postgresql+asyncpg://photolamp_runtime:${POSTGRES_RUNTIME_PASSWORD:-local-runtime-only}@postgres:5432/${POSTGRES_DB:-photolamp}
  REDIS_URL: redis://redis:6379/0

x-owner-environment: &owner-environment
  DATABASE_URL: postgresql+asyncpg://photolamp_runtime:${POSTGRES_RUNTIME_PASSWORD:-local-runtime-only}@postgres:5432/${POSTGRES_DB:-photolamp}
  DATABASE_OWNER_URL: postgresql+asyncpg://${POSTGRES_USER:-photolamp}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-photolamp}

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-photolamp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-photolamp}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-bookworm
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  db-bootstrap:
    image: photolamp-api:local
    build: ./apps/api
    environment: *owner-environment
    command: ["python", "-m", "app.bootstrap_runtime_role"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  migrate:
    image: photolamp-api:local
    build: ./apps/api
    environment: *owner-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db-bootstrap: { condition: service_completed_successfully }
    restart: "no"

  api:
    image: photolamp-api:local
    build: ./apps/api
    environment: *api-environment
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s

  web:
    image: photolamp-web:local
    build: ./apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready',{signal:AbortSignal.timeout(5000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s

volumes:
  postgres-data:
