# For the existing SelfOS host/Traefik. Never publish application or database ports.
name: photolamp-test

x-staging-environment: &staging-environment
  APP_ENV: staging
  ENABLE_DEMO_PREVIEWS: "true"
  HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-600}
  CHECKOUT_SESSION_TTL_SECONDS: ${CHECKOUT_SESSION_TTL_SECONDS:-1800}
  CHECKOUT_RATE_LIMIT_WINDOW_SECONDS: ${CHECKOUT_RATE_LIMIT_WINDOW_SECONDS:-60}
  CHECKOUT_SESSION_RATE_LIMIT: ${CHECKOUT_SESSION_RATE_LIMIT:-10}
  CHECKOUT_MUTATION_RATE_LIMIT: ${CHECKOUT_MUTATION_RATE_LIMIT:-10}
  SMS_PROVIDER_MODE: disabled
  OTP_PEPPER: ${OTP_PEPPER:-local-synthetic-otp-pepper-change-me}
  CONTACT_ACTIVE_KEY_VERSION: ${CONTACT_ACTIVE_KEY_VERSION:?Configure an active contact key version}
  CONTACT_ENCRYPTION_KEYS: '${CONTACT_ENCRYPTION_KEYS:?Configure a versioned contact keyring}'
  OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
  OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
  OTP_REQUEST_RATE_LIMIT: ${OTP_REQUEST_RATE_LIMIT:-3}
  OTP_VERIFY_RATE_LIMIT: ${OTP_VERIFY_RATE_LIMIT:-10}
  CUSTOMER_SESSION_TTL_SECONDS: ${CUSTOMER_SESSION_TTL_SECONDS:-86400}
  STAFF_SESSION_TTL_SECONDS: ${STAFF_SESSION_TTL_SECONDS:-43200}
  STAFF_INVITATION_TTL_SECONDS: ${STAFF_INVITATION_TTL_SECONDS:-172800}
  STAFF_AUTH_RATE_LIMIT: ${STAFF_AUTH_RATE_LIMIT:-10}
  DATABASE_URL: postgresql+asyncpg://photolamp_runtime:${POSTGRES_RUNTIME_PASSWORD:?Configure a staging runtime database password}@postgres:5432/${POSTGRES_DB:-photolamp}
  REDIS_URL: redis://redis:6379/0

x-staging-owner-environment: &staging-owner-environment
  APP_ENV: staging
  ENABLE_DEMO_PREVIEWS: "true"
  DATABASE_URL: postgresql+asyncpg://photolamp_runtime:${POSTGRES_RUNTIME_PASSWORD:?Configure a staging runtime database password}@postgres:5432/${POSTGRES_DB:-photolamp}
  DATABASE_OWNER_URL: postgresql+asyncpg://${POSTGRES_USER:-photolamp}:${POSTGRES_PASSWORD:?Configure a staging database password}@postgres:5432/${POSTGRES_DB:-photolamp}
  REDIS_URL: redis://redis:6379/0

x-api-build: &api-build
  context: ./apps/api
  args:
    PHOTOLAMP_DEPLOY_SHA: ${PHOTOLAMP_DEPLOY_SHA:?An exact CI-tested SHA is required}

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure a staging database password}
    ports: !reset []
    volumes: !override
      - /mnt/raid/photolamp-test/postgres:/var/lib/postgresql/data
    networks: [internal]

  redis:
    restart: unless-stopped
    ports: !reset []
    networks: [internal]

  db-bootstrap:
    image: photolamp-test-api:${PHOTOLAMP_DEPLOY_SHA:?An exact CI-tested SHA is required}
    build: *api-build
    environment: *staging-owner-environment
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  migrate:
    image: photolamp-test-api:${PHOTOLAMP_DEPLOY_SHA:?An exact CI-tested SHA is required}
    build: *api-build
    environment: *staging-owner-environment
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  api:
    image: photolamp-test-api:${PHOTOLAMP_DEPLOY_SHA:?An exact CI-tested SHA is required}
    build: *api-build
    environment: *staging-environment
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    ports: !reset []
    networks:
      internal:
        aliases: [photolamp-test-backend]

  backup-crypto:
    profiles: [maintenance]
    image: photolamp-test-api:${PHOTOLAMP_DEPLOY_SHA:?An exact CI-tested SHA is required}
    build: *api-build
    entrypoint: ["python", "-m", "app.backup_archive"]
    command: ["inspect"]
    environment:
      BACKUP_ACTIVE_KEY_ID: ${BACKUP_ACTIVE_KEY_ID:?Configure a backup active key ID}
      BACKUP_ENCRYPTION_KEYS: ${BACKUP_ENCRYPTION_KEYS:?Configure a versioned backup keyring}
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  offsite-backup:
    profiles: [maintenance]
    image: photolamp-test-api:${PHOTOLAMP_DEPLOY_SHA:?An exact CI-tested SHA is required}
    build: *api-build
    entrypoint: ["python", "-m", "app.offsite_backup"]
    command: ["verify"]
    environment:
      AWS_EC2_METADATA_DISABLED: "true"
      OFFSITE_BACKUP_ENDPOINT_URL: ${OFFSITE_BACKUP_ENDPOINT_URL:-}
      OFFSITE_BACKUP_REGION: ${OFFSITE_BACKUP_REGION:-}
      OFFSITE_BACKUP_BUCKET: ${OFFSITE_BACKUP_BUCKET:-}
      OFFSITE_BACKUP_PREFIX: ${OFFSITE_BACKUP_PREFIX:-}
      OFFSITE_BACKUP_ADDRESSING_STYLE: ${OFFSITE_BACKUP_ADDRESSING_STYLE:-path}
      OFFSITE_BACKUP_ACCESS_KEY_ID: ${OFFSITE_BACKUP_ACCESS_KEY_ID:-}
      OFFSITE_BACKUP_SECRET_ACCESS_KEY: ${OFFSITE_BACKUP_SECRET_ACCESS_KEY:-}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backup-egress]

  contact-maintenance:
    profiles: [maintenance]
    image: photolamp-test-api:${PHOTOLAMP_DEPLOY_SHA:?An exact CI-tested SHA is required}
    build: *api-build
    environment:
      APP_ENV: staging
      ENABLE_DEMO_PREVIEWS: "true"
      CONTACT_ACTIVE_KEY_VERSION: ${CONTACT_ACTIVE_KEY_VERSION:?Configure an active contact key version}
      CONTACT_ENCRYPTION_KEYS: '${CONTACT_ENCRYPTION_KEYS:?Configure a versioned contact keyring}'
      DATABASE_URL: postgresql+asyncpg://photolamp_runtime:${POSTGRES_RUNTIME_PASSWORD:?Configure a staging runtime database password}@postgres:5432/${POSTGRES_DB:-photolamp}
      DATABASE_OWNER_URL: postgresql+asyncpg://${POSTGRES_USER:-photolamp}:${POSTGRES_PASSWORD:?Configure a staging database password}@postgres:5432/${POSTGRES_DB:-photolamp}
      REDIS_URL: redis://redis:6379/0
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  web:
    environment:
      APP_ENV: staging
      API_INTERNAL_URL: http://photolamp-test-backend:8000
    image: photolamp-test-web:${PHOTOLAMP_DEPLOY_SHA:?An exact CI-tested SHA is required}
    build:
      context: ./apps/web
      args:
        PHOTOLAMP_DEPLOY_SHA: ${PHOTOLAMP_DEPLOY_SHA:?An exact CI-tested SHA is required}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    ports: !reset []
    networks: [internal, traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.photolamp-test.rule: "Host(`photolamp-test.anliwei.pro`)"
      traefik.http.routers.photolamp-test.entrypoints: websecure
      traefik.http.routers.photolamp-test.tls: "true"
      traefik.http.routers.photolamp-test.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-myresolver}
      traefik.http.routers.photolamp-test.middlewares: photolamp-test-auth@docker
      traefik.http.services.photolamp-test.loadbalancer.server.port: "3000"
      traefik.http.middlewares.photolamp-test-auth.basicauth.users: ${TRAEFIK_BASIC_AUTH_USERS:?Configure staging Basic Auth}
      traefik.http.middlewares.photolamp-test-auth.basicauth.removeheader: "true"

networks:
  default: !reset null
  internal:
    internal: true
  backup-egress:
    internal: false
  traefik:
    external: true
    name: traefik

volumes:
  postgres-data: !reset null
